<!DOCTYPE html>
<html lang="pt-Br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDog</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="../js/Home.js"></script>

</head>

<body>

    <header>
        <center><img id="logo" src="../img/Logo completa.png" alt=""></center>
    </header>

    <!-- NOVA NAV-BAR -->
    <nav>
        <a href="../html/home.html">Home</a>
        <a href="../html/Sobre.html">Sobre</a>
        <a href="../html/Contato.html">Contato</a>
        <a href="../html/Login.html">Login</a>
    </nav>

    <div class="containe_Cadastrados">
        <h2>Cadastro de Pets</h2>

        <div class="input-group">
            <label>Nome do Pet:</label>
            <input type="text" id="petNome" />
        </div>

        <div class="input-group">
            <label>Tipo do Pet:</label>
            <select id="petTipo">
                <option value="">Selecione...</option>
                <option value="Cachorro">Cachorro</option>
                <option value="Gato">Gato</option>
            </select>
        </div>

        <div class="input-group">
            <label>Raça:</label>
            <input type="text" id="petRaca" />
        </div>

        <div class="input-group">
            <label>Idade:</label>
            <input type="number" id="petIdade" />
        </div>

        <div class="input-group">
            <label>Foto do Pet:</label>
            <input type="file" id="petFoto" accept="image/*" />
        </div>

        <div class="input-group">
            <label>Sintomas do Animal:</label>

            <!-- Sintomas por checkbox -->
            <div style="margin-bottom:10px;">
                <label><input type="checkbox" class="sintomaCheck" value="tosse"> Tosse</label><br>
                <label><input type="checkbox" class="sintomaCheck" value="vomito"> Vômito</label><br>
                <label><input type="checkbox" class="sintomaCheck" value="diarreia"> Diarreia</label><br>
                <label><input type="checkbox" class="sintomaCheck" value="falta_apetite"> Falta de
                    Apetite</label><br>
                <label><input type="checkbox" class="sintomaCheck" value="coceira"> Coceira</label><br>
            </div>

            <!-- Sintomas extras digitados manualmente -->
            <textarea id="petSintomas" rows="3" placeholder="Descreva outros sintomas..."
                style="width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;"></textarea>

            <!-- Cuidados automáticos -->
            <button type="button" onclick="gerarCuidados()" style="margin-top:10px;background:#ffae2b">Gerar
                Cuidados</button>
        </div>

        <div class="input-group">
            <label>Cuidados Necessários:</label>
            <textarea id="petCuidados" rows="3"
                style="width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;"></textarea>
        </div>

        <button onclick="cadastrarPet()">Cadastrar Pet</button>

        <h3 style="margin-top:25px; text-align:center;">Pets Cadastrados</h3>
        <div class="pet-list" id="listaPets"></div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-about">
                <h3>Sobre Nós</h3>
                <p>Na CatDog, cuidamos do bem-estar de cães e gatos com amor, atenção e profissionalismo.</p>
            </div>


            <div class="footer-links">
                <h3>Links Rápidos</h3>
                <ul>
                    <li><a href="./index.html">Início</a></li>
                    <li><a href="../html/Login.html">Login</a></li>
                    <li><a href="../html/Sobre.html">Sobre</a></li>
                    <li><a href="../html/Contato.html">Contato</a></li>
                </ul>
            </div>


            <div class="footer-logo">
                <img src="../img/Logo completa.png" alt="Cat Dog">
            </div>
        </div>

        <hr class="footer-divider">
        <p class="footer-copy">&copy; 2025 Cat Dog. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
