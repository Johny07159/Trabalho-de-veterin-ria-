<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDog</title>

    <!-- Fonts e Ícones -->
    <link href="https://fonts.cdnfonts.com/css/tt-fors-trial" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/Login.css">

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon_io/favicon-16x16.png">
</head>

<body>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Cadastre-se</h1>
                <div class="social-icons">
                </div>
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                <button>Cadastrar-se</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form>
                <h1>Entre</h1>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
                 <button>Entrar</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <img id="Logo_lateral" src="" alt="">
                    <h1>Seja Bem-Vindo</h1>
                    <p>Registre Seus Dados Pessoais para Navegar no nosso site</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                <img id="Logo-lateral" src="" alt="">
                    <h1>Seja Bem-Vindo</h1>
                    <p>Registre Seus Dados Pessoais para Navegar no nosso site</p>
                    <button class="hidden" id="register">Cadastra-se</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts Bootstrap e seu JS -->
    <script src="../js/Login.js"></script>
</body>

</html>
