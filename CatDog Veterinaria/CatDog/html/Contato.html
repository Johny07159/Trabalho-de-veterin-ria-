<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato • CatDog</title>
    <link rel="stylesheet" href="../css/Cantato.css">
    <script src="../js/Contato.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <center><img id="logo" src="../img/Logo completa.png" alt="CatDog"></center>
    </header>

    <!-- NAV BAR -->
    <nav>
        <a href="../html/home.html">Home</a>
        <a href="../html/Sobre.html">Sobre</a>
        <a href="../html/Contato.html" class="active">Contato</a>
        <a href="../html/Login.html">Login</a>
    </nav>

    <!-- SESSÃO DE CONTATO -->
    <section class="contato-container">

        <h1>Fale Conosco</h1>
        <p class="subtexto">Estamos aqui para ajudar você e seu pet com carinho e atenção.</p>

        <div class="contato-box">

            <form>

                <div class="input-group">
                    <label>Seu Nome</label>
                    <input type="text" placeholder="Digite seu nome" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label>Assunto</label>
                    <input type="text" placeholder="Sobre o que deseja falar?" required>
                </div>

                <div class="input-group">
                    <label>Mensagem</label>
                    <textarea rows="5" placeholder="Digite sua mensagem..." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>

            </form>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-content">

            <div class="footer-about">
                <h3>Sobre Nós</h3>
                <p>Na CatDog, cuidamos do bem-estar de cães e gatos com amor e dedicação.</p>
            </div>

            <div class="footer-links">
                <h3>Links</h3>
                <ul>
                    <li><a href="../html/home.html">Início</a></li>
                    <li><a href="../html/Login.html">Login</a></li>
                    <li><a href="../html/Sobre.html">Sobre</a></li>
                    <li><a href="../html/Contato.html">Contato</a></li>
                </ul>
            </div>

            <div class="footer-logo">
                <img src="../img/Logo completa.png" alt="CatDog Logo">
            </div>

        </div>

        <hr class="footer-divider">
        <p class="footer-copy">&copy; 2025 CatDog. Todos os direitos reservados.</p>

    </footer>

</body>

</html>
